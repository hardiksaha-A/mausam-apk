name: Build Android APK

# Free cloud build: GitHub compiles the APK for you, no Android Studio needed.
# Run it from the "Actions" tab -> "Build Android APK" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # lets the workflow publish the APK on the Releases page
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # the desktop app's binary isn't needed here
    steps:
      - uses: actions/checkout@v4

      # Beginner-proof: if the files were uploaded inside sub-folders (for
      # example "upload-1-of-3-root-and-public"), move them up to the top level.
      - name: Tidy uploaded folders
        run: |
          for d in */; do
            d="${d%/}"
            [ -d "$d" ] || continue
            case "$d" in android|src|public|node_modules) continue;; esac
            echo "Merging $d into the project root"
            cp -rn "$d"/. .
          done
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already has the Android SDK installed. We only need to
      # accept Google's licenses (the third-party setup-android action crashed here).
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "SDK folder: $SDK"; ls "$SDK" | head -20

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into the Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check the APK is valid
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex|assets/public/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: mausam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Puts Mausam.apk on the Releases page: a plain .apk any phone can download
      # directly in Chrome (no zip, no WhatsApp). If this step ever fails, the APK
      # is still available under "Artifacts" on the run page.
      - name: Publish APK to the Releases page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Mausam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mausam.apk --target "$GITHUB_SHA" \
            --title "Mausam Android app (latest build)" \
            --notes "Download Mausam.apk on your Android phone (Android 7.0 or newer), open it from your Downloads folder, and allow Install unknown apps if asked."
